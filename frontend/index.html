<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlasmaForge</title>
  <style>
    /* Kept inline rather than a separate stylesheet: this is the entire
       page-level styling for a full-viewport 3D canvas app — there is no
       traditional page layout to warrant a CSS file yet. */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Subtle radial vignette instead of flat black — gives the scene
         some depth/atmosphere behind the globe rather than looking like
         a cutout pasted on pure black. */
      background: radial-gradient(circle at 50% 45%, #0d1220 0%, #05060a 65%, #000000 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      width: 100vw;
      height: 100vh;
    }

    #fps-counter {
      position: fixed;
      top: 12px;
      left: 12px;
      color: rgba(200, 210, 255, 0.7);
      font-size: 12px;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="fps-counter">-- FPS</div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
